# CI services/api (Go): vet → test → build. Deploy ke VPS hanya bila variabel repo DEPLOY_API_ENABLED = 'true'
# (dimatikan sampai VPS baru selesai disiapkan dengan user deploy terbatas + SSH key khusus CI).
name: API

on:
  push:
    branches: [main]
    paths: ['services/api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['services/api/**', '.github/workflows/api.yml']
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Build static binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o bin/server ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: api-server
          path: services/api/bin/server
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_API_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-server
          path: bin
      - name: Upload binary via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: bin/server
          target: /tmp/goodiebox-deploy
          strip_components: 1
      - name: Install binary and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            sudo install -m 755 /tmp/goodiebox-deploy/server /opt/goodiebox/server
            sudo systemctl restart goodiebox-server
            sudo systemctl --no-pager status goodiebox-server
