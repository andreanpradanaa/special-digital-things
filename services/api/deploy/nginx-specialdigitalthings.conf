# /etc/nginx/sites-available/specialdigitalthings
# Hub di root, Goodiebox di /goodiebox/, halaman penerima /gift/:slug, API di /api/, upload di /uploads/.
# Blok 443 + sertifikat ditambahkan otomatis oleh `certbot --nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name specialdigitalthings.com www.specialdigitalthings.com;

    server_tokens off;
    client_max_body_size 26m;   # upload video maks 25 MB

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API Go (hanya listen di localhost:8080, port diblokir firewall dari luar)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Foto/video yang diunggah pengirim
    location /uploads/ {
        alias /opt/goodiebox/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        types { image/webp webp; image/jpeg jpg jpeg; image/png png; video/mp4 mp4; video/webm webm; }
        default_type application/octet-stream;
    }

    # Goodiebox (builder) — SPA di bawah /goodiebox/
    location = /goodiebox {
        return 301 /goodiebox/;
    }
    location /goodiebox/ {
        alias /var/www/goodiebox/;
        try_files $uri $uri/ /goodiebox/index.html;
    }
    location /goodiebox/assets/ {
        alias /var/www/goodiebox/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Halaman penerima hadiah: link lama /gift/<slug> tetap berfungsi
    location /gift/ {
        root /var/www/goodiebox;
        try_files /index.html =404;
    }

    # Hub (katalog) — SPA di root
    root /var/www/hub;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
